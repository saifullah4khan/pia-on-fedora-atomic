# Reference copy of the file install.sh writes to
# /etc/NetworkManager/conf.d/wgpia.conf
#
# PIA's own installer creates this, but never gets that far on Fedora Atomic:
# it aborts one step earlier when it tries to copy its icon into the read-only
# /usr/share/pixmaps. Without this rule, NetworkManager can take over PIA's
# WireGuard interface and drop the DNS settings PIA applied to it whenever the
# machine changes network.

[keyfile]
unmanaged-devices=interface-name:wgpia*
